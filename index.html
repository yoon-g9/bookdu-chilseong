<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>북두칠성 · 읽은 책이 별이 되는 곳</title>
<meta name="description" content="읽은 책을 별로 모아 나만의 별자리를 키우는 독서 기록 서비스">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="paper">
<div class="stage" id="stage" data-phase="idle">

  <section class="head">
    <p class="eyebrow">JUST VUILD 2026 · M3WE</p>
    <h1 class="title" id="title" aria-label="북두칠성"><span class="tx">북두칠성</span><i class="under" aria-hidden="true"></i></h1>
    <p class="sub">읽은 책이 별이 되어 나만의 별자리가 자라는,<br>밤의 작은 도서관</p>
  </section>

  <section class="win" id="win">
    <div class="arch">
      <div class="glass" id="glass">
        <canvas id="sky" aria-hidden="true"></canvas>
        <svg class="scene" id="scene" viewBox="0 0 100 130" preserveAspectRatio="none" role="img" aria-label="별 사다리를 올라 북두칠성을 그리는 초록이">
          <defs>
            <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
              <feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <path id="s5" d="M0-4.2 1.2-1.4 4.2-1.1 1.9.9 2.6 3.9 0 2.3-2.6 3.9-1.9.9-4.2-1.1-1.2-1.4Z"/>
          </defs>
          <g id="clouds" opacity=".9">
            <path d="M-6 130V112c6-9 17-10 22-4 4-9 18-11 25-3 5-7 15-6 18 2v23z" fill="#1b2c6a"/>
            <path d="M52 130v-14c5-8 15-9 20-3 5-8 17-8 22 1 3-4 8-5 12-3v19z" fill="#223579"/>
          </g>
          <g id="ladder"></g>
          <g id="dipper"></g>
        </svg>
        <div class="climber" id="climber"><img id="climberImg" src="assets/char/green-wave.webp" alt=""></div>
        <div class="gloss" aria-hidden="true"></div>
      </div>
      <!-- 창턱: 책 더미와 따뜻한 커피 -->
      <div class="ledge" aria-hidden="true">
        <div class="books"><i style="--c:#9b3b2e;--w:56px"></i><i style="--c:#2f5d50;--w:48px"></i><i style="--c:#c9a05a;--w:52px"></i></div>
        <svg class="cup" viewBox="0 0 60 60">
          <path class="steam s1" d="M22 24c-4-5 4-7 0-12"/><path class="steam s2" d="M31 24c-4-5 4-7 0-12"/><path class="steam s3" d="M40 24c-4-5 4-7 0-12"/>
          <path d="M10 28h40v8c0 10-8 16-20 16S10 46 10 36z" fill="#F4ECDB"/><path d="M10 28h40" stroke="#1E3932" stroke-width="3"/>
          <path d="M50 31c9 0 9 12-2 12" fill="none" stroke="#F4ECDB" stroke-width="3.5"/>
          <circle cx="30" cy="40" r="4.2" fill="#1E3932"/><path d="M30 36.5l1 2.5 2.5.3-1.9 1.7.6 2.6-2.2-1.4-2.2 1.4.6-2.6-1.9-1.7 2.5-.3z" fill="#DDB96C"/>
        </svg>
      </div>
    </div>
  </section>

  <section class="foot">
    <div class="cta"><a class="btn" href="my.html" id="start">별 만나러 가기</a></div>
    <div class="shelf">
      <div class="chars" id="chars" aria-hidden="true">
        <div class="ch" data-a="purple-wand" data-b="purple-rest" style="--w:clamp(70px,9vw,112px);--ar:.89"></div>
        <div class="ch" data-a="blue-wave" data-b="blue-read" style="--w:clamp(62px,8vw,100px);--ar:.72"></div>
        <div class="ch" data-a="orange-cheer" data-b="orange-wave" style="--w:clamp(68px,8.6vw,108px);--ar:.87"></div>
        <div class="ch" data-a="yellow-wave" data-b="yellow-thumb" style="--w:clamp(64px,8.2vw,102px);--ar:.96"></div>
      </div>
      <div class="plank"></div>
    </div>
  </section>

  <div class="ctrl">
    <button class="chip" id="skip" type="button">건너뛰기</button>
    <button class="chip" id="replay" type="button" hidden>인트로 다시 보기</button>
  </div>
</div>
<script src="intro.js"></script>
</body>
</html>
